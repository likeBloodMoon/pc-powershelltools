name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (without the leading v)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: powershell
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') {
              $env:GITHUB_REF -replace '^refs/tags/v', ''
          } else {
              '${{ github.event.inputs.version }}'
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Building version $version"

      - name: Verify the manifest matches the tag
        shell: powershell
        run: |
          $manifest = Import-PowerShellDataFile ./src/PCTools/PCTools.psd1
          $tagged = '${{ steps.version.outputs.version }}'
          if ($manifest.ModuleVersion -ne $tagged) {
              throw "Tag v$tagged does not match ModuleVersion $($manifest.ModuleVersion). Bump the manifest before tagging."
          }

      - name: Install test dependencies
        shell: powershell
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Force -SkipPublisherCheck -Scope CurrentUser
          Install-Module PSScriptAnalyzer -RequiredVersion 1.22.0 -Force -Scope CurrentUser

      # Never publish something that has not passed its own suite.
      - name: Test and analyze
        shell: powershell
        run: ./build/Invoke-Build.ps1 -Task All

      # Compiled first so the signing step below can sign the module that
      # actually ships, before it is packed into an archive. Signing after
      # packaging would leave the file inside every zip unsigned - which is the
      # one file users execute.
      - name: Compile the module
        shell: powershell
        run: ./build/Invoke-Build.ps1 -Task Compile

      # Signing runs only when a certificate is configured. Without it the
      # release still ships, unsigned, with checksums - which is what the
      # project has today.
      - name: Sign the module and scripts
        if: ${{ secrets.SIGNING_CERTIFICATE != '' }}
        env:
          SIGNING_CERTIFICATE: ${{ secrets.SIGNING_CERTIFICATE }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        shell: powershell
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:SIGNING_CERTIFICATE))
          $password = ConvertTo-SecureString $env:SIGNING_PASSWORD -AsPlainText -Force
          $cert = Get-PfxCertificate -FilePath $pfxPath -Password $password

          # The compiled module, the GUI shell inside it, the bootstrapper and
          # the legacy single-file tools - everything a user can execute.
          $targets = @()
          $targets += Get-ChildItem ./obj/PCTools -Include *.ps1, *.psm1, *.psd1 -Recurse -File
          $targets += Get-ChildItem . -Filter *.ps1 -File

          foreach ($target in $targets) {
              Set-AuthenticodeSignature -FilePath $target.FullName -Certificate $cert `
                  -TimestampServer 'http://timestamp.digicert.com' -HashAlgorithm SHA256
          }

          Remove-Item $pfxPath -Force

      # -SkipCompile so the signatures written above survive into the archives.
      - name: Stage artifacts and checksums
        shell: powershell
        run: ./build/Invoke-Build.ps1 -Task Release -SkipCompile -Version ${{ steps.version.outputs.version }}

      # Publishing to the Gallery is opt-in: without an API key the release
      # still ships as an archive. Gallery versions are immutable, so this runs
      # after the suite has passed and only for a tagged build.
      - name: Publish to the PowerShell Gallery
        if: ${{ secrets.PSGALLERY_API_KEY != '' && startsWith(github.ref, 'refs/tags/v') }}
        shell: powershell
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          # The compiled, signed module - not the source tree. Publishing the
          # sources would ship the sixty-file dot-sourcing loader and, when a
          # certificate is configured, discard the signatures.
          $module = './obj/PCTools'

          # Refuse to republish a version that already exists - the Gallery
          # rejects it anyway, and failing here says why.
          $version = (Import-PowerShellDataFile "$module/PCTools.psd1").ModuleVersion
          $existing = Find-Module PCTools -RequiredVersion $version -ErrorAction SilentlyContinue
          if ($existing) {
              throw "PCTools $version is already on the PowerShell Gallery. Bump ModuleVersion before tagging."
          }

          Publish-Module -Path $module -NuGetApiKey $env:PSGALLERY_API_KEY -Verbose

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*
          generate_release_notes: true
          body: |
            ## Install

            ```powershell
            irm https://raw.githubusercontent.com/likeBloodMoon/pc-powershelltools/${{ github.ref_name }}/install.ps1 | iex
            ```

            The installer prefers the signed PowerShell Gallery package and falls
            back to the archive below, verifying it against `SHA256SUMS` first.

            ## Verifying this release yourself

            Every file below is listed in `SHA256SUMS`:

            ```powershell
            (Get-FileHash pc-tools-${{ github.ref_name }}.zip -Algorithm SHA256).Hash.ToLower()
            # compare against the matching line in SHA256SUMS
            ```

            Full instructions are in the
            [README](https://github.com/likeBloodMoon/pc-powershelltools#install-and-run-in-one-command).
